# Learn more about configuring your checkout UI extension:
# https://shopify.dev/docs/api/checkout-ui-extensions/configuration

api_version = "2025-01"

[[extensions]]
uid = "a900833f-d5c6-2234-ce8b-10789012957e62b9c5b8"
type = "ui_extension"
name = "Fitted - Post-Purchase Installation"
handle = "fitted-checkout"

[[extensions.targeting]]
target = "purchase.thank-you.block.render"
module = "./src/index.ts"

[extensions.capabilities]
network_access = true
block_progress = false

[extensions.capabilities.customer_privacy]
# Request Level 2 access for shipping address data
customer_data_access = "level_2"
analytics_access = false
